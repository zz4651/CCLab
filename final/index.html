<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ken Zhang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
            font-size: 2em;
            font-weight: bold;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #222;
            padding: 10px;
        }
        nav a {
            color: #fff;
            padding: 12px 20px;
            text-decoration: none;
            font-size: 1.2em;
            text-transform: uppercase;
        }
        nav a:hover {
            background-color: #444;
        }
        main {
            padding: 40px 20px;
            text-align: center;
        }
        main h2 {
            font-size: 2.5em;
            font-weight: lighter;
            margin-bottom: 30px;
        }
        footer {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 15px;
            position: fixed;
            width: 100%;
            bottom: 0;
            font-size: 1em;
        }
        #p5-container {
            width: 100%;
            height: 400px;
            margin-top: 30px;
        }
        nav a:first-child {
            margin-left: 0;
        }
        nav a:last-child {
            margin-right: 0;
        }
    </style>
    <script src="library/p5.js"></script>
    <script src="library/p5.sound.js"></script>
    <script src="script/sketch.js"></script>
</head>
<body>
    <header>
        Ken Zhang's IMA Coding Lab
    </header>

    <nav>
        <a href="#1">Midwork</a>
        <a href="#2">Finalwork</a>
        <a href="#3">Firework</a>
    </nav>

    <main>
        <h2>Ken ZHANG 张知行</h2>
        <div id="p5-container">
            <!-- p5.js canvas will go here -->
        </div>
    </main>

    <footer>
        <p>&copy; Ken Zhang</p>
    </footer>
</body>
</html>
