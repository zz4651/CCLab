    <title>Ken Zhang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Pingfang', sans-serif;
            background-color: #fff;
            color: #333;
            line-height: 1.6;
        }
        header {
			font-family: 'Pingfang', sans-serif;
            background-color: #000;
            color: #fff;
            padding: 5px;
            text-align: center;
            font-size: 2em;
            font-weight: bold;
        }
        nav {
			font-family: 'Pingfang', sans-serif;
            display: flex;
            justify-content: center;
            background-color: #fff;
            padding: 10px;
        }
        nav a {
			font-family: "Gill Sans", "Gill Sans MT", "Myriad Pro", "DejaVu Sans Condensed", Helvetica, Arial, "sans-serif";

            color: #333;
            padding: 12px 55px;

            font-size: 1.2em;

        }
        nav a:hover {
            background-color: #444;
        }
        main {
            padding: 10px;
            text-align: center;
        }
        main h2 {
            font-size: 6em;
            font-weight: lighter;
            margin-bottom: 5px;
        }
        footer {
			font-family: "Gill Sans", "Gill Sans MT", "Myriad Pro", "DejaVu Sans Condensed", Helvetica, Arial, "sans-serif";
			font-weight: lighter;
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 15px;
            position: fixed;
            width: 100%;
            bottom: 0;
            font-size: 1em;
        }
        #p5-container {
            width: 100%;
           
		min-height: 2000px; /* 设置最小高度 */
            margin-top: 30px;
        }
        nav a:first-child {
            margin-left: 0;
        }
        nav a:last-child {
            margin-right: 0;
        }
	a {
	    color: inherit;
	    text-decoration: none; 
	}
	
    </style>
    <script src="library/p5.js"></script>
    <script src="library/p5.sound.js"></script>
    <script src="script/sketch.js"></script>
</head>
